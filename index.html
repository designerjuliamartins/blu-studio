<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blu Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: Figma-like editor — slim top bar, left panel (presets + saved), canvas, right properties panel */
:root{
  --bg:#F5F5F5; --panel:#FFFFFF; --ink:#1E1E1E; --soft:#6B6B6B; --faint:#A3A3A3; --line:#E6E6E6;
  --hover:#F2F2F2; --sel:#EAF3FD; --brand:#4795E0; --canvas:#EDEDED;
  --font:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1E1E; --panel:#2C2C2C; --ink:#F0F0F0; --soft:#B3B3B3; --faint:#7A7A7A; --line:#3A3A3A;
  --hover:#363636; --sel:#22384F; --brand:#6FB2E8; --canvas:#1E1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1E1E; --panel:#2C2C2C; --ink:#F0F0F0; --soft:#B3B3B3; --faint:#7A7A7A; --line:#3A3A3A;
  --hover:#363636; --sel:#22384F; --brand:#6FB2E8; --canvas:#1E1E1E; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:12px;line-height:1.4;-webkit-font-smoothing:antialiased}
.app{height:100%;display:grid;grid-template-rows:48px minmax(0,1fr)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;min-width:0}
.brand svg{width:22px;height:22px;flex:none}
.brand span{color:var(--faint);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:6px}
.tb{height:30px;padding:0 10px;border-radius:6px;border:0;background:none;color:var(--ink);font:inherit;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tb:hover{background:var(--hover)}
.tb svg{width:16px;height:16px}
.tb.primary{background:var(--brand);color:#fff}
.tb.primary:hover{opacity:.9;background:var(--brand)}
.body{display:grid;grid-template-columns:220px minmax(0,1fr) 288px;min-height:0}
.side{background:var(--panel);overflow:auto;min-height:0}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
.sec{padding:12px 12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:11px;color:var(--ink)}
.sec-h small{font-weight:400;color:var(--faint);font-size:11px}
.list{display:flex;flex-direction:column;gap:1px}
.li{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px;border-radius:6px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%}
.li:hover{background:var(--hover)}
.li[aria-pressed="true"]{background:var(--sel)}
.li .th{width:24px;height:24px;border-radius:6px;overflow:hidden;flex:none;display:grid;place-items:center}
.li .th svg{width:24px;height:24px}
.saved{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sv{position:relative;aspect-ratio:1/1;border-radius:8px;border:1px solid var(--line);overflow:hidden;cursor:pointer;padding:0}
.sv svg{width:100%;height:100%;display:block}
.sv .x{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:4px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;line-height:16px;display:none;cursor:pointer;padding:0}
.sv:hover .x,.sv:focus-within .x{display:block}
.empty{color:var(--faint)}
.canvas{position:relative;background:var(--canvas);display:grid;place-items:center;overflow:auto;padding:32px;min-height:0;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px}
.frame-label{position:absolute;top:16px;left:20px;color:var(--soft);font-size:11px}
.artboard{width:min(420px,100%);aspect-ratio:1/1;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);display:grid;place-items:center;overflow:hidden;background:var(--panel)}
.artboard svg{width:100%;height:100%;display:block}
.status{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:6px 12px;border-radius:8px;font-size:12px;white-space:nowrap}
.status:empty{display:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.opt{aspect-ratio:1/1;border-radius:8px;border:1px solid transparent;background:var(--hover);padding:2px;cursor:pointer;display:grid;place-items:center;position:relative}
.opt:hover{border-color:var(--line)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--sel)}
.opt svg{width:100%;height:100%}
.sw-row{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.08);padding:0;cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--brand)}
.sw.none{background:repeating-linear-gradient(45deg,var(--line) 0 3px,var(--panel) 3px 6px)}
.toggles{display:flex;flex-direction:column;gap:1px}
.tg{display:flex;align-items:center;justify-content:space-between;height:30px;padding:0 6px;border-radius:6px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer}
.tg:hover{background:var(--hover)}
.tg .sw-i{width:28px;height:16px;border-radius:8px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg .sw-i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg[aria-pressed="true"] .sw-i{background:var(--brand)}
.tg[aria-pressed="true"] .sw-i::after{transform:translateX(12px)}
.cur{color:var(--soft);font-weight:400}
textarea{width:100%;height:90px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:11px ui-monospace,monospace;padding:6px}
.artboard.transparent{background-color:#fff!important;background-image:linear-gradient(45deg,#E9E9E9 25%,transparent 25%,transparent 75%,#E9E9E9 75%),linear-gradient(45deg,#E9E9E9 25%,transparent 25%,transparent 75%,#E9E9E9 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.field{display:flex;flex-direction:column;gap:6px}
.input{height:32px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;padding:0 8px;width:100%}
.input:focus{border-color:var(--brand);outline:none}
.fig-btn{height:32px;border-radius:6px;border:0;background:var(--ink);color:var(--panel);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.fig-btn:disabled{opacity:.5;cursor:default}
.fig-msg{color:var(--soft);min-height:16px}
.fig-msg a{color:var(--brand)}
.muted{color:var(--faint)}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
@media (max-width:900px){
  .app{height:auto}
  .body{grid-template-columns:minmax(0,1fr)}
  .canvas{order:-1;min-height:360px;padding:20px}
  .left,.right{border:0;border-top:1px solid var(--line)}
  .grid{grid-template-columns:repeat(5,1fr)}
  .side{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
}
@media (max-width:520px){.tb .lbl{display:none}}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand" id="brand">Blu Studio <span>/ mascot builder</span></div>
    <div class="tools">
      <button class="tb" id="random" type="button" title="Surprise me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg><span class="lbl">Surprise me</span></button>
      <button class="tb" id="save" type="button" title="Save version"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg><span class="lbl">Save</span></button>
      <button class="tb" id="copyPng" type="button" title="Copy PNG"><span class="lbl">Copy PNG</span><span class="lbl" aria-hidden="true" hidden></span></button>
      <button class="tb primary" id="copySvg" type="button" title="Copy SVG for Figma">Copy SVG</button>
    </div>
  </header>

  <div class="body">
    <aside class="side left" aria-label="Presets and saved">
      <div class="sec"><div class="sec-h">Presets</div><div class="list" id="presets"></div></div>
      <div class="sec"><div class="sec-h">Saved <small>this browser</small></div><div class="saved" id="saved"></div></div>
    </aside>

    <main class="canvas" aria-label="Canvas">
      <div class="frame-label" id="flabel">cold-flame</div>
      <div class="artboard" id="tile"></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <aside class="side right" aria-label="Properties">
      <div class="sec"><div class="sec-h">Colour <small class="cur" id="c-color"></small></div><div class="sw-row" id="o-color"></div></div>
      <div class="sec"><div class="sec-h">Eyes <small class="cur" id="c-eyes"></small></div><div class="grid" id="o-eyes"></div></div>
      <div class="sec"><div class="sec-h">Mouth <small class="cur" id="c-mouth"></small></div><div class="grid" id="o-mouth"></div></div>
      <div class="sec"><div class="sec-h">On top <small class="cur" id="c-top"></small></div><div class="grid" id="o-top"></div></div>
      <div class="sec"><div class="sec-h">Extras</div><div class="toggles" id="o-extras"></div></div>
      <div class="sec"><div class="sec-h">Background <small class="cur" id="c-bg"></small></div><div class="sw-row" id="o-bg"></div></div>
      <div class="sec" id="figsec">
        <div class="sec-h">Place in Figma <small id="figstate">connector</small></div>
        <div class="field">
          <input class="input" id="figlink" type="url" placeholder="Paste a Figma file or frame link" aria-label="Figma file or frame link">
          <button class="fig-btn" id="figplace" type="button">Place in Figma</button>
          <div class="fig-msg" id="figmsg" role="status" aria-live="polite"><span class="muted">Adds the character as editable vectors next to what's there. Uses the current background, or none if Transparent.</span></div>
        </div>
      </div>
      <div class="sec" id="fbsec" hidden><div class="sec-h">SVG code</div><textarea id="fallback" aria-label="SVG code"></textarea></div>
    </aside>
  </div>
</div>

    case "grin":return `<g transform="translate(${x} ${y-6}) scale(.62) translate(-222 -230)"><path d="M282 230C288.627 230 294.125 235.396 293.32 241.975C289.97 269.374 273.261 290 222 290C170.739 290 154.03 269.374 150.68 241.975C149.875 235.396 155.373 230 162 230H282Z" fill="#4A4A4E" stroke="${k}" stroke-width="10"/><path d="M272.25 278.663C261.242 285.796 245.142 290 222 290C175.551 290 157.472 273.065 151.994 249.5C173.25 239.75 249 249.5 272.25 278.663Z" fill="#FF55A2" stroke="${k}" stroke-width="10"/><path d="M180 234.5C180 232.015 182.015 230 184.5 230H211.5C213.985 230 216 232.015 216 234.5V248C216 254.627 210.627 260 204 260H192C185.373 260 180 254.627 180 248V234.5Z" fill="white" stroke="${k}" stroke-width="10"/><path d="M216 234.5C216 232.015 218.015 230 220.5 230H247.5C249.985 230 252 232.015 252 234.5V248C252 254.627 246.627 260 240 260H228C221.373 260 216 254.627 216 248V234.5Z" fill="white" stroke="${k}" stroke-width="10"/></g>`;
    case "teeth":return `<rect x="${x-40}" y="${y-10}" width="80" height="26" rx="13" fill="${k}"/>`+[-25,-11,3,17].map(d=>`<rect x="${x+d}" y="${y-10}" width="8" height="26" fill="#fff"/>`).join("")+`<rect x="${x-40}" y="${y-10}" width="80" height="26" rx="13" fill="none" stroke="${k}" stroke-width="6"/>`;
    case "o":return `<ellipse cx="${x}" cy="${y+4}" rx="11" ry="12" fill="${k}"/><ellipse cx="${x}" cy="${y+9}" rx="6" ry="4" fill="#FF6B7A"/>`;
    case "wow":return `<g transform="translate(${x} ${y+2}) scale(.55) translate(-230 -254)"><path d="M256.5 286C262.851 286 268.069 280.831 267.39 274.516C264.177 244.65 248.659 222 230 222C211.341 222 195.823 244.65 192.61 274.516C191.931 280.831 197.149 286 203.5 286H256.5Z" fill="${k}"/><path d="M254 286C254 273.85 242.359 264 228 264C213.641 264 202 273.85 202 286H254Z" fill="#FF3979"/></g>`;
    case "tongue":return `<path d="${P_MOUTH}" fill="${k}"/><path d="M${x-14} ${y+5} Q${x} ${y-4} ${x+14} ${y+5} Q${x+14} ${y+15} ${x} ${y+15} Q${x-14} ${y+15} ${x-14} ${y+5} Z" fill="#FF6B7A"/>`;
    case "flat":return `<path d="M${x-22} ${y+2} H${x+22}" stroke="${k}" stroke-width="9" stroke-linecap="round"/>`;
  }
  return "";
}
function topper(t){
  const K=INK, o=`stroke="${K}" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"`;
  switch(t){
    case "party":return `<g transform="rotate(-10 190 70)">
<path d="M128 74 Q190 94 252 74 L198 -60 Z" fill="#5DB8FF" ${o}/>
<path d="M152 30 Q192 44 233 30" stroke="#FFD447" stroke-width="10" fill="none"/>
<path d="M173 -10 Q195 -1 217 -10" stroke="#FFD447" stroke-width="9" fill="none"/>
<path d="M128 74 Q190 94 252 74 L198 -60 Z" fill="none" ${o}/>
<path d="M156 52 L180 -8" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/>
<circle cx="198" cy="-66" r="14" fill="#FF8FC4" ${o}/><circle cx="194" cy="-70" r="4" fill="#fff"/></g>`;
    case "crown":return `<g transform="rotate(-6 190 50)">
<path d="M116 80 L116 40 L136 -6 L162 28 L190 -24 L218 28 L244 -6 L264 40 L264 80 Q190 94 116 80 Z" fill="#FFD447" ${o}/>
<path d="M118 58 Q190 72 262 58" stroke="#E9A800" stroke-width="7" fill="none"/>
<circle cx="190" cy="50" r="10" fill="#FF3B4E" stroke="${K}" stroke-width="5"/><circle cx="148" cy="56" r="6.5" fill="#5DB8FF" stroke="${K}" stroke-width="4"/><circle cx="232" cy="56" r="6.5" fill="#56C487" stroke="${K}" stroke-width="4"/>
<path d="M130 42 L130 64" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
<circle cx="136" cy="-6" r="6" fill="#FFD447" ${o}/><circle cx="190" cy="-24" r="6" fill="#FFD447" ${o}/><circle cx="244" cy="-6" r="6" fill="#FFD447" ${o}/></g>`;
    case "halo":return `<g transform="rotate(-6 196 -8)"><ellipse cx="196" cy="-8" rx="72" ry="17" fill="none" stroke="${K}" stroke-width="18"/><ellipse cx="196" cy="-8" rx="72" ry="17" fill="none" stroke="#FFD447" stroke-width="9"/><path d="M146 -18 Q160 -24 178 -25" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/></g>`;
    case "bow":return `<g transform="translate(286 72) rotate(20)">
<path d="M0 0 C-14 -30 -52 -34 -50 -6 C-48 18 -14 16 0 0 Z" fill="#FF5AA0" ${o}/>
<path d="M0 0 C14 -30 52 -34 50 -6 C48 18 14 16 0 0 Z" fill="#FF5AA0" ${o}/>
<path d="M-34 -16 Q-30 -22 -22 -22 M20 -22 Q28 -22 32 -16" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".8"/>
<rect x="-12" y="-13" width="24" height="24" rx="9" fill="#FF8FC4" ${o}/></g>`;
    case "cap":return `<g transform="rotate(-4 190 40)">
<path d="M104 84 Q100 -12 190 -14 Q278 -12 274 80 Q190 66 104 84 Z" fill="#FF5A6E" ${o}/>
<path d="M190 -12 Q184 30 188 72" stroke="${K}" stroke-width="4" fill="none" opacity=".35"/>
<path d="M126 44 Q130 10 158 -2" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" opacity=".75"/>
<path d="M250 72 Q318 50 344 76 Q306 98 244 88 Z" fill="#E33A50" ${o}/>
<circle cx="190" cy="-15" r="8" fill="#E33A50" stroke="${K}" stroke-width="5"/></g>`;
    case "beanie":return `<g transform="rotate(-5 190 50)">
<path d="M98 90 Q94 -8 190 -12 Q286 -8 282 90 Z" fill="#FFB347" ${o}/>
<path d="M92 66 Q190 46 288 66 L290 102 Q190 82 90 102 Z" fill="#FF8A1F" ${o}/>
${[112,136,160,184,208,232,256].map(x=>`<path d="M${x+4} ${60-(x>190?(x-190)/6:(190-x)/6)*0.4} L${x+4} ${90}" stroke="${K}" stroke-width="3.5" opacity=".3"/>`).join("")}
<path d="M122 40 Q128 12 156 0" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" opacity=".7"/>
<circle cx="190" cy="-22" r="22" fill="#FFF4E0" ${o}/><circle cx="182" cy="-30" r="6" fill="#fff"/></g>`;
  }
  return "";
}
function extras(x){
  let s="";
  if(x.blush) s+=`<ellipse cx="150" cy="238" rx="20" ry="11" fill="#FF7E9D" opacity=".55"/><ellipse cx="310" cy="238" rx="20" ry="11" fill="#FF7E9D" opacity=".55"/>`;
  if(x.bandage) s+=`<g transform="rotate(-30 252 126)"><rect x="216" y="112" width="72" height="28" rx="11" fill="#F7D9A8" stroke="${INK}" stroke-width="6"/><rect x="241" y="112" width="22" height="28" fill="#E9BC7A" stroke="${INK}" stroke-width="5"/></g>`;
  if(x.zzz){const Z=(zx,zy,s)=>`<path d="M${zx} ${zy} h${s} l-${s} ${s} h${s}" stroke="${INK}" stroke-width="${Math.max(4,s/4)}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;s+=Z(300,58,30)+Z(338,22,20)+Z(364,0,13);}
  if(x.sweat) s+=`<path d="M318 92 C330 112 336 124 326 134 C316 142 302 134 305 120 C307 110 312 102 318 92 Z" fill="#8FD3FF" stroke="${INK}" stroke-width="6"/>`;
  if(x.hearts) s+=`<g transform="${FACE}">${ART.extras.hearts}</g>`;
  if(x.sparkles){const st=(cx,cy,r,c)=>`<path d="M${cx} ${cy-r} Q${cx} ${cy} ${cx+r} ${cy} Q${cx} ${cy} ${cx} ${cy+r} Q${cx} ${cy} ${cx-r} ${cy} Q${cx} ${cy} ${cx} ${cy-r} Z" fill="${c}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`;
    s+=st(30,52,20,"#FFD447")+st(324,300,16,"#FF8FE8")+st(330,40,13,"#5DB8FF");}
  return s;
}
/* full character. Viewbox padded so hats and sparkles fit */
function draw(c,withBg){
  const p=PAL[c.color], x=c.extras||{}, id=++uid, sh=x.shadow!==false;
  const vb="-20 -90 387 440";
  const bg=(withBg&&BG[c.bg])?`<rect x="-20" y="-90" width="387" height="440" fill="${BG[c.bg]}"/>`:"";
  const under=ART.under[c.eyes]?`<g transform="${FACE}">${ART.under[c.eyes]}</g>`:"";
  const face=mouth(c.mouth)+eyes(c.eyes,id);
  const ex=extras(x);
  const extra=artDefs(under+face+ex);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="387" height="440" fill="none">${defs(id,sh).replace("</defs>",extra+"</defs>")}${bg}<g id="cold-flame">${under}${flame(p,id,sh)}${face}${x.ear!==false?ear(p,id,sh):""}${topper(c.top)}${ex}</g></svg>`;
}


/* ---------- UI (Figma-like) ---------- */
const $=id=>document.getElementById(id);
const thumb=c=>draw(c,false);
function optGrid(id,map,key){
  const el=$(id);el.innerHTML="";
  Object.entries(map).forEach(([k,n])=>{const b=document.createElement("button");b.type="button";b.className="opt";b.id=id+"-"+k;b.title=n;b.setAttribute("aria-label",n);
    b.setAttribute("aria-pressed",S[key]===k);b.innerHTML=thumb({...S,[key]:k});b.onclick=()=>{S[key]=k;render();};el.appendChild(b);});
}
function swatches(id,map,key,label){
  const el=$(id);el.innerHTML="";
  Object.entries(map).forEach(([k,c])=>{const b=document.createElement("button");b.type="button";b.className="sw"+(c?"":" none");b.id=id+"-"+k;
    if(c)b.style.background=c;b.title=label(k);b.setAttribute("aria-label",label(k));b.setAttribute("aria-pressed",S[key]===k);
    b.onclick=()=>{S[key]=k;render();};el.appendChild(b);});
}
function render(){
  $("tile").innerHTML=draw(S,false);
  $("tile").style.background=BG[S.bg]||"";$("tile").classList.toggle("transparent",!BG[S.bg]);
  swatches("o-color",Object.fromEntries(Object.entries(PAL).map(([k,v])=>[k,v.base])),"color",k=>PAL[k].n);
  swatches("o-bg",BG,"bg",k=>k==="none"?"Transparent":k[0].toUpperCase()+k.slice(1));
  optGrid("o-eyes",EYES,"eyes");optGrid("o-mouth",MOUTHS,"mouth");optGrid("o-top",TOPS,"top");
  $("c-color").textContent=PAL[S.color].n;$("c-eyes").textContent=EYES[S.eyes];$("c-mouth").textContent=MOUTHS[S.mouth];
  $("c-top").textContent=TOPS[S.top];$("c-bg").textContent=S.bg==="none"?"Transparent":S.bg[0].toUpperCase()+S.bg.slice(1);
  const ex=$("o-extras");ex.innerHTML="";
  Object.entries(EXTRAS).forEach(([k,n])=>{const on=(k==="ear"||k==="shadow")?S.extras[k]!==false:!!S.extras[k];
    const b=document.createElement("button");b.type="button";b.className="tg";b.id="x-"+k;b.setAttribute("aria-pressed",on);
    b.innerHTML=`<span>${n}</span><span class="sw-i" aria-hidden="true"></span>`;b.onclick=()=>{S.extras[k]=!on;render();};ex.appendChild(b);});
  const pl=$("presets");pl.innerHTML="";
  PRESETS.forEach((p,i)=>{const b=document.createElement("button");b.type="button";b.className="li";b.id="p-"+i;
    b.setAttribute("aria-pressed",JSON.stringify(p.c)===JSON.stringify(S));
    b.innerHTML=`<span class="th" style="background:${BG[p.c.bg]||"transparent"}">${thumb(p.c)}</span><span>${p.n}</span>`;
    b.onclick=()=>{S=JSON.parse(JSON.stringify(p.c));render();};pl.appendChild(b);});
}
function pick(o){const k=Object.keys(o);return k[Math.floor(Math.random()*k.length)];}
$("random").onclick=()=>{let bg=pick(BG);if(bg==="none")bg="pink";
  S={color:Math.random()>.5?"blue":pick(PAL),eyes:pick(EYES),mouth:pick(MOUTHS),top:Math.random()>.5?"none":pick(TOPS),bg,
     extras:{ear:true,shadow:true,blush:Math.random()>.7,sparkles:Math.random()>.75,hearts:Math.random()>.85,sweat:Math.random()>.85}};render();};
function say(t){$("status").textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>$("status").textContent="",2600);}
function exportSvg(){return draw(S,BG[S.bg]!=="");}
$("copySvg").onclick=async()=>{const svg=exportSvg();
  try{await navigator.clipboard.writeText(svg);$("fbsec").hidden=true;say("SVG copied — paste into Figma");}
  catch(e){$("fbsec").hidden=false;const f=$("fallback");f.value=svg;f.focus();f.select();say("Copy blocked here. Code selected in the panel; press Cmd+C");}};
$("copyPng").onclick=async()=>{
  try{const svg=exportSvg().replace('width="387" height="440"','width="1161" height="1320"');
    const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);});
    const cv=document.createElement("canvas");cv.width=1161;cv.height=1320;cv.getContext("2d").drawImage(img,0,0);
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);say("PNG copied");
  }catch(e){say("This viewer blocks image copy — use Copy SVG");}};
const KEY="blu-studio-saved";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]");}catch(e){return [];}}
function store(a){try{localStorage.setItem(KEY,JSON.stringify(a));return true;}catch(e){return false;}}
function renderSaved(){const el=$("saved");el.innerHTML="";const a=load();
  if(!a.length){el.innerHTML=`<span class="empty" style="grid-column:1/-1">Press Save to keep versions here.</span>`;return;}
  a.forEach((c,i)=>{const b=document.createElement("div");b.className="sv";b.style.background=BG[c.bg]||"var(--panel)";b.innerHTML=thumb(c);
    b.tabIndex=0;b.setAttribute("role","button");b.setAttribute("aria-label","Load saved version "+(i+1));
    b.onclick=()=>{S=JSON.parse(JSON.stringify(c));render();};b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();b.onclick();}};
    const x=document.createElement("button");x.type="button";x.className="x";x.textContent="×";x.setAttribute("aria-label","Remove");
    x.onclick=e=>{e.stopPropagation();const z=load();z.splice(i,1);store(z);renderSaved();};b.appendChild(x);el.appendChild(b);});}
$("save").onclick=()=>{const a=load();a.unshift(JSON.parse(JSON.stringify(S)));if(store(a.slice(0,40))){renderSaved();say("Saved");}else say("This browser blocks saving here");};

/* ---------- Place in Figma (viewer's Figma connector) ---------- */
const FIGMA="Figma";
const LINKKEY="blu-studio-figlink";
try{const l=localStorage.getItem(LINKKEY);if(l)$("figlink").value=l;}catch(e){}
function parseFig(url){
  const m=String(url).match(/figma\.com\/(?:design|file)\/([A-Za-z0-9]{22,128})(?:\/branch\/([A-Za-z0-9]{22,128}))?/);
  if(!m) return null;
  const n=String(url).match(/[?&]node-id=([0-9]+)[-:]([0-9]+)/);
  return {fileKey:m[2]||m[1],nodeId:n?n[1]+":"+n[2]:null};
}
function figMsg(html){$("figmsg").innerHTML=html;}
let mcpP=null;
function getMcp(){if(!mcpP)mcpP=(window.claude&&window.claude.use)?window.claude.use("mcp"):Promise.resolve(null);return mcpP;}
getMcp().then(m=>{$("figstate").textContent=m?"connector":"unavailable here";if(!m){$("figplace").disabled=true;figMsg('<span class="muted">Placing needs the Figma connector, which this view can\'t reach. Use Copy SVG and paste into Figma instead.</span>');}});
function nameFor(c){return "Blu / "+PAL[c.color].n+" / "+EYES[c.eyes]+(c.top!=="none"?" / "+TOPS[c.top]:"");}
$("figplace").onclick=async()=>{
  const link=$("figlink").value.trim();const t=parseFig(link);
  if(!t){figMsg("Paste a link that starts with figma.com/design/…");$("figlink").focus();return;}
  try{localStorage.setItem(LINKKEY,link);}catch(e){}
  const mcp=await getMcp();
  if(!mcp){figMsg("This view can't reach the Figma connector. Use Copy SVG instead.");return;}
  const svg=exportSvg();
  const code=`const svg=${JSON.stringify(svg)};
const nodeId=${JSON.stringify(t.nodeId)};
let anchor=null;
if(nodeId){anchor=await figma.getNodeByIdAsync(nodeId);}
let page=figma.root.children[0];
if(anchor){let p=anchor;while(p&&p.type!=="PAGE")p=p.parent;if(anchor.type==="PAGE")p=anchor;if(p)page=p;}
await figma.setCurrentPageAsync(page);
const n=figma.createNodeFromSvg(svg);
n.name=${JSON.stringify(nameFor(S))};
const inside=anchor&&(anchor.type==="FRAME"||anchor.type==="SECTION")&&anchor.layoutMode!=="HORIZONTAL"&&anchor.layoutMode!=="VERTICAL";
if(inside){anchor.appendChild(n);n.x=24;n.y=24;}
else if(anchor&&anchor.type!=="PAGE"&&"absoluteBoundingBox" in anchor&&anchor.absoluteBoundingBox){const b=anchor.absoluteBoundingBox;n.x=b.x+b.width+80;n.y=b.y;}
else{const kids=page.children.filter(c=>c!==n);const r=kids.length?Math.max(...kids.map(c=>c.x+c.width)):0;const top=kids.length?Math.min(...kids.map(c=>c.y)):0;n.x=r+120;n.y=top;}
return {id:n.id,page:page.name,inside:!!inside};`;
  $("figplace").disabled=true;figMsg("Placing…");
  try{
    const res=await mcp.callTool(FIGMA,"use_figma",{fileKey:t.fileKey,code,description:"Place Blu from Blu Studio"});
    const p=res.payload||{};let out=p;
    if(typeof p==="string"){try{out=JSON.parse(p);}catch(e){out={};}}
    const id=(out&&out.id)||(out&&out.result&&out.result.id);
    const url="https://www.figma.com/design/"+t.fileKey+"/"+(id?"?node-id="+String(id).replace(":","-"):"");
    figMsg(`Placed${out&&out.page?" on “"+out.page+"”":""}. <a href="${url}" target="_blank" rel="noopener">Open in Figma</a>`);
  }catch(e){
    const c=e&&e.code;
    if(c==="server_not_connected"||c==="server_not_found") figMsg("Add the Figma connector in claude.ai Settings → Connectors, then try again.");
    else if(c==="needs_reauth") figMsg("Reconnect Figma in claude.ai Settings → Connectors, then try again.");
    else if(c==="approval_required"||c==="not_in_manifest"||c==="consent_required") figMsg("This page needs your permission to use Figma. Press Place in Figma again and choose Allow.");
    else if(c==="selection_required") figMsg("You have more than one Figma connector. Pick one in the prompt, then try again.");
    else if(c==="blocked_by_policy") figMsg("Your organization blocks this Figma action. Use Copy SVG instead.");
    else if(c==="tool_error") figMsg("Figma refused: "+String(e.message||"").slice(0,160)+" Check that you can edit this file.");
    else if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed") figMsg("This view can't reach the Figma connector. Use Copy SVG instead.");
    else figMsg("Figma didn't confirm. Check the file before trying again, it may already be there.");
  }finally{$("figplace").disabled=false;}
};
$("brand").insertAdjacentHTML("afterbegin",draw(BRAND,false));
render();renderSaved();
})();

</script>
